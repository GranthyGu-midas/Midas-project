# Two independent shards: BTC on shard 1, ETH on shard 2.
# Global symbolIds follow the symbol entries: BTC=1, ETH=2.
routing=router
gateway_listen=127.0.0.1,7001
router_listen=127.0.0.1,7100
engine_endpoint=127.0.0.1,7100
user=alice,alice-pass
user=bob,bob-pass
user=carol,carol-pass
shard=1,127.0.0.1,7201
shard=2,127.0.0.1,7202
symbol=BTC,100,1
symbol=ETH,100,2
# Decimal increments; legacy reference prices above are ignored.
instrument=BTC,0.01,0.00000001
instrument=ETH,0.01,0.00000001
max_connections=4096
max_pending=65536
max_pending_per_client=1024
max_buffer_bytes=4194304
heartbeat_ms=500
link_timeout_ms=5000
request_timeout_ms=5000
partial_timeout_ms=2000
reconnect_ms=200
